[package]
name = "ua-ai"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Unified multi-provider LLM API for unified-agent-rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
